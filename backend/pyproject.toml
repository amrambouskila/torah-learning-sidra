[project]
name = "sidra"
version = "0.1.0"
description = "Torah Learning Sidra — Torah-learning progress tracker"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
]

[project.scripts]
sidra-db = "sidra.cli.sidra_db:app"
sidra-api = "sidra.cli.sidra_api:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pip-audit>=2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages` already carries everything under src/sidra, the YAML overrides included. A
# force-include of the same directory adds each of those files a second time at the same archive
# path, which hatchling refuses -- so `uv build` failed outright until it was removed.
packages = ["src/sidra"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # assert, and literal credentials in fixtures

[tool.ruff.lint.isort]
known-first-party = ["sidra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# pytest-asyncio 1.x gives each test its own event loop and each session-scoped fixture
# another. A session-scoped AsyncEngine then fails with "attached to a different loop".
# Pinning both scopes to the session puts fixtures and tests on one loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers"]
markers = [
    "integration: requires the compose Postgres",
    "live: hits the real Sefaria API",
]

[tool.coverage.run]
source = ["src/sidra"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
