  - name_en: Tanya
    name_he: תניא
    category: shabbat
    kind: curated_queue
    # Sefaria's title carries a literal semicolon; it is part of the string, not a delimiter.
    work_ref_title: "Tanya, Part I; Likkutei Amarim"
    rate: 1
    period: week

  # The three parsha-weekly works all begin at Shabbos Bereishis, 2026-10-10. Until then they
  # display "starts in N weeks" and accrue nothing.
  - name_en: Likutei Sichot
    name_he: ליקוטי שיחות
    category: shabbat
    kind: parsha_weekly
    work_ref_title: Likutei Sichot
    rate: 1
    period: week
    starts_on: 2026-10-10
    tags: [parsha]

  - name_en: The Midrash Says
    name_he: המדרש אומר
    category: shabbat
    kind: parsha_weekly
    work_ref_title: The Midrash Says
    rate: 1
