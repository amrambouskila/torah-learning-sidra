server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Google Fonts is the one external host this app talks to: David Libre, Spectral and IBM Plex
    # Mono are served from fonts.googleapis.com with the faces themselves on fonts.gstatic.com.
    # `connect-src 'self'` keeps every API call on this origin, which the /api proxy below serves.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8285;
        # The forwarded header below carries a client-controlled value in general, but nothing
        # behind this proxy reads it: the backend builds no absolute URLs, issues no redirects,
        # and its CORS allowlist is an explicit origin rather than a reflection of the request.
        # The rule name is spelled out rather than the variable, which would match the rule again.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8285/health;
    }

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
